<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tableau en liège 3D</title>
<style>
:root{--bg1:#f3faf8;--bg2:#d3e2df;--ink:#2b2b2b;--panel:#fffdf6;--line:#d8d2c0;--btn:#2b2b2b;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a3433;--bg2:#141a19;--ink:#f1eee4;--panel:#2c2a26;--line:#4a463d;--btn:#f1eee4;--btnt:#1c1c1c}}
:root[data-theme="dark"]{--bg1:#2a3433;--bg2:#141a19;--ink:#f1eee4;--panel:#2c2a26;--line:#4a463d;--btn:#f1eee4;--btnt:#1c1c1c}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 35%,var(--bg1),var(--bg2));font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
canvas{display:block;touch-action:none}
#hint{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:14px;opacity:.7;pointer-events:none;transition:opacity .4s}
#panel{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(440px,92vw);transform:translate(-50%,160%);opacity:0;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .35s,opacity .35s}
#panel.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
textarea{position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;font-size:16px;resize:none}
.row{display:flex;gap:8px;margin-top:8px}
select,button{font:inherit;border-radius:8px;border:1px solid var(--line);padding:8px 10px;background:transparent;color:var(--ink);cursor:pointer}
#ok{margin-left:auto;background:var(--btn);color:var(--btnt);border-color:var(--btn)}
#zoom{position:fixed;z-index:5;top:calc(14px + env(safe-area-inset-top,0px));left:14px;display:flex;align-items:center;width:120px;height:46px;background:#fdfdfd;border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.07)}
#zoom button{flex:1;height:100%;padding:0;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
#zoom span{width:1px;height:26px;background:#d6d6d6}
#zoom svg{width:15px;height:15px;stroke:#343434;stroke-width:10;fill:none;overflow:visible}
#fit{position:fixed;z-index:5;top:calc(14px + env(safe-area-inset-top,0px));left:142px;width:46px;height:46px;padding:0;border:0;background:#fdfdfd;border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.07);display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
#fit svg{width:18px;height:18px;stroke:#343434;stroke-width:2.4;fill:none}
#fit.on{background:#e6e6e6}
</style></head><body>
<div id="hint">Prends un post-it, écris un mot et valide : tu obtiens sa définition</div>
<div id="zoom"><button id="zo" aria-label="Dézoomer"><svg viewBox="0 0 82 82"><path d="M0 41h82"/></svg></button><span></span><button id="zi" aria-label="Zoomer"><svg viewBox="0 0 82 82"><path d="M0 41h82M41 0v82"/></svg></button></div>
